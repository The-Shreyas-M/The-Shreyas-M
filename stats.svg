.tube{clip-path:inset(0 0 0 0);animation:tube 8s steps(22) infinite}
@keyframes tube{0%{clip-path:inset(0 100% 0 0)}30%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}

