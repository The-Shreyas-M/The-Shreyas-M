<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 168" width="1000" height="420" shape-rendering="crispEdges" role="img" aria-label="Holographic billboard with GitHub stats: 2 stars, 228 commits this year, top language Rust"><style>
image{image-rendering:pixelated;image-rendering:crisp-edges}
.flick{opacity:0;animation:flick 5s steps(1) infinite}
