<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="1000" height="350" role="img" aria-label="Pixel-art hardware workbench at night: an ESP32 board, a synth with a bar meter, a hovering drone and an oscilloscope tracing a sine wave." shape-rendering="crispEdges">
<style>
image{image-rendering:pixelated;image-rendering:crisp-edges}
.scope{animation:scope-run 0.8s steps(8) infinite}@keyframes scope-run{from{transform:translateX(0)}to{transform:translateX(-512px)}}@media (prefers-reduced-motion:reduce){.scope{animation:none}}
.meter{animation:meter-run 0.6s steps(4) infinite}@keyframes meter-run{from{transform:translateX(0)}to{transform:translateX(-160px)}}@media (prefers-reduced-motion:reduce){.meter{animation:none}}
.led1{animation:led1-run 1s steps(2) infinite}@keyframes led1-run{from{transform:translateX(0)}to{transform:translateX(-4px)}}@media (prefers-reduced-motion:reduce){.led1{animation:none}}
.led2{animation:led2-run 1.4s steps(2) infinite}@keyframes led2-run{from{transform:translateX(0)}to{transform:translateX(-4px)}}@media (prefers-reduced-motion:reduce){.led2{animation:none}}
.led3{animation:led3-run 0.7s steps(2) infinite}@keyframes led3-run{from{transform:translateX(0)}to{transform:translateX(-4px)}}@media (prefers-reduced-motion:reduce){.led3{animation:none}}
.drone{animation:drone-run 0.15s steps(2) infinite}@keyframes drone-run{from{transform:translateX(0)}to{transform:translateX(-128px)}}@media (prefers-reduced-motion:reduce){.drone{animation:none}}
.smoke{animation:smoke-run 1.8s steps(6) infinite}@keyframes smoke-run{from{transform:translateX(0)}to{transform:translateX(-72px)}}@media (prefers-reduced-motion:reduce){.smoke{animation:none}}
.bob{animation:bob 2s steps(2) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<image x="0" y="0" width="400" height="140" href="data:image/png;base64,"/>
<g class="bob"><g transform="translate(150 16)"><clipPath id="drone-clip"><rect width="64" height="20"/></clipPath><g clip-path="url(#drone-clip)"><image class="drone" href="data:image/png;base64," width="128" height="20" style="image-rendering:pixelated"/></g></g></g>
<g transform="translate(278 42)"><clipPath id="scope-clip"><rect width="64" height="40"/></clipPath><g clip-path="url(#scope-clip)"><image class="scope" href="data:image/png;base64," width="512" height="40" style="image-rendering:pixelated"/></g></g>
<g transform="translate(200 77)"><clipPath id="meter-clip"><rect width="40" height="10"/></clipPath><g clip-path="url(#meter-clip)"><image class="meter" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAAAKCAYAAAAzSFWlAAAAbklEQVR42u3WQQoAIAhE0U7UObu1rdoHio74hTYDUtSLWouiKsv2sTemrkVpXqXzAGCDXiWAv71SyDsC9BxcdG80NgA2gJUBMAOHEsAyBwDsmSm9IK45Mm7DNBzTshSASv8zMgCSkcXgZRPIKrMLGGzUbG7jjf8AAAAASUVORK5CYII=" width="160" height="10" style="image-rendering:pixelated"/></g></g>
<g transform="translate(86 89)"><clipPath id="led1-clip"><rect width="2" height="2"/></clipPath><g clip-path="url(#led1-clip)"><image class="led1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAFklEQVR42mP4bxz6H4SlRQzAmAFdAAAVbQ+RLboABAAAAABJRU5ErkJggg==" width="4" height="2" style="image-rendering:pixelated"/></g></g>
<g transform="translate(244 78)"><clipPath id="led2-clip"><rect width="2" height="2"/></clipPath><g clip-path="url(#led2-clip)"><image class="led2" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAB/qH1jAAAAFklEQVR42mOw//DsPwhLixiAMQO6AAA/3RHJOyUcsgAAAABJRU5ErkJggg==" width="4" height="2" style="image-rendering:pixelated"/></g></g>
