<g transform="translate(244 46)"><clipPath id="smoke-clip"><rect width="12" height="24"/></clipPath><g clip-path="url(#smoke-clip)"><image class="smoke" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAAAYCAYAAABZY7uwAAAAS0lEQVR42u3TsQkAIBAEwe/Zvowtx1LEDoyEP2bgU4NjrYI21tzjXre3DURoGTHFGYi/S3cszkD4kgaSnyIC6zAQWcUZCBUYCHh1AAr9mHlTCfHVAAAAAElFTkSuQmCC" width="72" height="24" style="image-rendering:pixelated"/></g></g>
