<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 144" width="240" height="360" role="img" aria-label="Pixel-art tower crowned by a giant mechanical eye that looks around: Oculius" shape-rendering="crispEdges">
<style>
image{image-rendering:pixelated;image-rendering:crisp-edges}
.eye-oculius{animation:eye-oculius-tl 6s steps(1,end) infinite}@keyframes eye-oculius-tl{0%{transform:translateX(-0px)}23.333%{transform:translateX(-48px)}40%{transform:translateX(-0px)}53.333%{transform:translateX(-96px)}70%{transform:translateX(-0px)}80%{transform:translateX(-144px)}93.333%{transform:translateX(-0px)}100%{transform:translateX(-0px)}}@media (prefers-reduced-motion:reduce){.eye-oculius{animation:none!important;transform:translateX(-0px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
