<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
  .tr {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
    animation: draw 12s infinite both;
  }
  #word > g:nth-child(1) .tr { animation-delay: 0s; }
  #word > g:nth-child(2) .tr { animation-delay: .1s; }
  #word > g:nth-child(3) .tr { animation-delay: .2s; }
  #word > g:nth-child(4) .tr { animation-delay: .3s; }
  #word > g:nth-child(5) .tr { animation-delay: .4s; }
  #word > g:nth-child(6) .tr { animation-delay: .5s; }
  #word > g:nth-child(7) .tr { animation-delay: .6s; }

  .pw {
    color: #46F5E0;
    animation: powercolor 12s infinite both;
  }
  @keyframes powercolor {
    0% { color: #E0893C; }
    20% { color: #E0893C; }
    24% { color: #46F5E0; }
    90% { color: #46F5E0; }
    100% { color: #E0893C; }
  }
  @keyframes draw {
    0% { stroke-dashoffset: 1; }
    18% { stroke-dashoffset: 0; }
    92% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 1; }
  }

  .via {
    opacity: 1;
    animation: viaon 12s infinite both;
  }
  @keyframes viaon {
    0% { opacity: 0; }
    20% { opacity: 0; }
    22% { opacity: 1; }
    96% { opacity: 1; }
    98% { opacity: 0; }
    100% { opacity: 0; }
  }

  .gl1, .gl2 {
    opacity: 0;
  }
  .gl1 { animation: glitch1 12s steps(2) infinite both; }
  .gl2 { animation: glitch2 12s steps(2) infinite both; }
  @keyframes glitch1 {
    0%, 25.9%, 27.6%, 62.9%, 64.1%, 100% { opacity: 0; transform: translate(0,0); }
    26%, 27.5% { opacity: .7; transform: translate(4px,-2px); }
    63%, 64% { opacity: .7; transform: translate(-4px,2px); }
  }
  @keyframes glitch2 {
    0%, 25.9%, 27.6%, 62.9%, 64.1%, 100% { opacity: 0; transform: translate(0,0); }
    26%, 27.5% { opacity: .7; transform: translate(-4px,2px); }
    63%, 64% { opacity: .7; transform: translate(4px,-2px); }
  }

  .scope {
    stroke-dasharray: 1;
    stroke-dashoffset: 0;
    animation: scope 12s infinite both;
  }
  @keyframes scope {
    0% { stroke-dashoffset: 1; }
    22% { stroke-dashoffset: 1; }
    34% { stroke-dashoffset: 0; }
    92% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 1; }
  }

  .cov {
    transform: translateX(830px);
  }
  .c1 { animation: t1 12s steps(28) infinite both; }
  .c2 { animation: t2 12s steps(28) infinite both; }
  .c3 { animation: t3 12s steps(28) infinite both; }
  .c4 { animation: t4 12s steps(28) infinite both; }
  @keyframes t1 {
    0%, 35.9% { transform: translateX(0); }
    40% { transform: translateX(830px); }
    95% { transform: translateX(830px); }
    96%, 100% { transform: translateX(0); }
  }
  @keyframes t2 {
    0%, 40.9% { transform: translateX(0); }
    46% { transform: translateX(830px); }
    95% { transform: translateX(830px); }
    96%, 100% { transform: translateX(0); }
  }
  @keyframes t3 {
    0%, 47.9% { transform: translateX(0); }
    52% { transform: translateX(830px); }
    95% { transform: translateX(830px); }
    96%, 100% { transform: translateX(0); }
  }
  @keyframes t4 {
    0%, 52.9% { transform: translateX(0); }
    62% { transform: translateX(830px); }
    95% { transform: translateX(830px); }
    96%, 100% { transform: translateX(0); }
  }

  .cursor {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
  }

  .scan {
    animation: scan 6s linear infinite;
  }
  @keyframes scan {
    0% { transform: translateY(0); }
    100% { transform: translateY(420px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</defs>
