# R6: daily regenerate dist/*.svg and publish to the orphan output branch
name: update-profile-svgs
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gen/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-profile-svgs
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node gen/stats.mjs
          node gen/contrib.mjs
          node gen/check.mjs
      - name: Push to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "update $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
